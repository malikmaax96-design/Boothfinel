<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <meta name="description" content="{{metaDescription}}">
  <link rel="canonical" href="{{canonical}}">
  {{#if noindex}}<meta name="robots" content="noindex,follow">{{/if}}
  <meta property="og:type" content="{{ogType}}">
  <meta property="og:site_name" content="{{site.name}}">
  <meta property="og:locale" content="en_GB">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{metaDescription}}">
  <meta property="og:url" content="{{canonical}}">
  <meta property="og:image" content="{{ogImage}}">
  <meta property="og:image:width" content="{{ogImageWidth}}">
  <meta property="og:image:height" content="{{ogImageHeight}}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{title}}">
  <meta name="twitter:description" content="{{metaDescription}}">
  <meta name="twitter:image" content="{{ogImage}}">
  <meta name="theme-color" content="{{site.themeColor}}">
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  {{#if preloadImage}}<link rel="preload" as="image" href="{{preloadImage.src}}" imagesrcset="{{preloadImage.srcset}}" imagesizes="{{preloadImage.sizes}}" type="image/webp">{{/if}}
  <link rel="preload" as="style" href="{{fontsHref}}">
  <link rel="stylesheet" href="{{fontsHref}}" media="print" data-font-css>
  <noscript><link rel="stylesheet" href="{{fontsHref}}"></noscript>
  <link rel="stylesheet" href="/css/style.css?v={{assetVersion}}">
  <script type="application/ld+json">{{{schemaJson}}}</script>
</head>
<body class="{{bodyClass}}">
  <a class="skip-link" href="#main">Skip to content</a>
{{> header}}
  <main id="main">
{{{content}}}
  </main>
{{> footer}}
{{> sticky-bar}}
  <script src="/js/script.js?v={{assetVersion}}" defer></script>
</body>
</html>
