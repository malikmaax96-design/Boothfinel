{{#if eventPhotos}}    <section class="event-photos section" id="event-photos">
      <div class="container">
        <div class="section-header reveal">
          <p class="section-eyebrow">Real events</p>
          <h2 class="section-title">{{eventPhotosHeading}}</h2>
        </div>
        <ul class="event-photos-grid">
          {{#each eventPhotos}}<li class="event-photo reveal">
            {{{picture}}}
            {{#if caption}}<p>{{caption}}</p>{{/if}}
          </li>
          {{/each}}
        </ul>
      </div>
    </section>
{{/if}}
